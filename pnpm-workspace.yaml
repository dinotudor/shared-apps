packages:
  - "apps/*"
  - "modules/*"
  - "packages/*"

# 7 days, in minutes. Setting this explicitly makes installs fail rather than
# fall back to a newer version.
minimumReleaseAge: 10080

# Urgent security fixes only, as exact versions. See guidelines/tooling.md.
# Example: pkg@1.2.3 # https://github.com/advisories/GHSA-xxxx (remove once 7 days old)
minimumReleaseAgeExclude: []

# Packages allowed to run install scripts. Review with `pnpm approve-builds`.
allowBuilds:
  # Required by Qwik. Both ship prebuilt binaries.
  sharp: false
  "@parcel/watcher": false
  # drizzle-kit (dev). The postinstall only checks the platform binary, which
  # comes in as an optional dependency anyway.
  esbuild: false
  # Testcontainers (dev). Native SSH helpers for remote Docker hosts; tests use
  # the local socket. protobufjs's script is a version check only.
  cpu-features: false
  ssh2: false
  protobufjs: false

# Versions shared by more than one package. Reference them with "catalog:".
catalog:
  # Exact: Qwik 2 is a release candidate (ADR 0011).
  "@qwik.dev/core": 2.0.0-rc.5
  # Client and server must stay on the same version.
  "@trpc/client": ^11.26.0
  "@trpc/server": ^11.26.0
  # packages/db and packages/auth (schema and repository) must share one version: Drizzle
  # table objects only work with the drizzle-orm instance that created the database.
  drizzle-orm: ^0.45.4
  vite: ^8.3.0
  zod: ^4.6.7
  # Keep @vitest/ui on the same version as vitest.
  "@vitest/ui": ^5.1.0
  vitest: ^5.1.0
