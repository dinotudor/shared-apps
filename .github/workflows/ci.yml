name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          install: false
      # Plain node: pnpm scripts install first, and this must run before any install.
      - run: node scripts/check-dependency-sources.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Database tests start PostgreSQL through Testcontainers; the runner has Docker.
      - run: pnpm test
      - name: Check that migrations match the schemas
        run: |
          # drizzle-kit fails when no schema file exists yet (before the first module).
          if [ -n "$(find modules packages -path '*/src/schema.ts' -not -path '*/node_modules/*' 2>/dev/null)" ]; then
            pnpm db:generate
            git add --intent-to-add packages/db/migrations
            git diff --exit-code -- packages/db/migrations
          else
            echo "No schema.ts yet; nothing to check."
          fi
      - run: pnpm build
      # The build adds new keys to i18n/*.json (playbook guideline i18n.md). The check fails on
      # missing, empty, unused or broken translations; the diff fails on keys not committed.
      - run: pnpm --filter @shared-apps/whats-for-dinner i18n:check
      - name: Check that the build added no uncommitted translation keys
        run: |
          git add --intent-to-add apps/whats-for-dinner/i18n
          git diff --exit-code -- apps/whats-for-dinner/i18n
